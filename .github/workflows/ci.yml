name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true
      - name: go vet
        run: go vet ./cmd/... ./internal/... ./pkg/...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
          args: ./cmd/... ./internal/... ./pkg/...
      - name: go test
        run: go test -race -count=1 ./cmd/... ./internal/... ./pkg/...

  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npm run format:check --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present -- --run
      - run: npm run build

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: validate dev env
        run: |
          terraform -chdir=terraform/envs/dev init -backend=false -input=false
          terraform -chdir=terraform/envs/dev validate
