name: Deploy backend

# Scaffolded for Phase 7. Disabled until infra is provisioned and ECR/EKS are
# wired up. Trigger is workflow_dispatch only so it never runs by accident.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: latest

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    if: false # Phase 7 will flip this on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          docker build -t $ECR_REGISTRY/supremacy:${{ inputs.image_tag }} .
          docker push $ECR_REGISTRY/supremacy:${{ inputs.image_tag }}
          # Image contains /usr/local/bin/{core-api,gateway,engine,worker,ai-bot,supremacy}.
          # K8s manifests set command per Deployment (see rollout step).

  rollout:
    if: false # Phase 7
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Update K8s deployment
        run: |
          aws eks update-kubeconfig --name supremacy --region us-east-1
          IMG=$ECR_REGISTRY/supremacy:${{ inputs.image_tag }}
          kubectl set image deployment/core-api core-api=$IMG
          kubectl set image deployment/gateway gateway=$IMG
          kubectl set image statefulset/engine engine=$IMG
          kubectl set image deployment/worker worker=$IMG
          kubectl set image deployment/ai-bot ai-bot=$IMG
